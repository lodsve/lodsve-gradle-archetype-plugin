plugins {
    id 'java'
    id 'org.springframework.boot' version '@springBootVersion@'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = '@groupId@'
version = '@version@'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "com.lodsve.boot:lodsve-boot-dependencies:@lodsveBootVersion@"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.lodsve.boot:lodsve-boot'
    implementation 'com.lodsve.boot:lodsve-boot-starter-swagger'
    implementation 'com.lodsve.boot:lodsve-boot-starter-mongodb'
}
